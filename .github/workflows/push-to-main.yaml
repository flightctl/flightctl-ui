name: Push to main

on:
  push:
    branches:
      - main
    tags:
      - '**'
env:
  QUAY_ORG: quay.io/flightctl
  QUAY_CHARTS: quay.io/flightctl/charts
  QUAY_STANDALONE_REPO: flightctl-ui
  QUAY_OCP_REPO: flightctl-ocp-ui

jobs:
  generate-tags:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.get-tags.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate image tags
        id: get-tags
        run: |
          if ${{ github.ref_type == 'tag' }}; then
            # The images tags will match the Release tag
            image_tags=( ${{ github.ref_name }} )
            image_tags=${image_tags#v} # remove the leading v prefix for version

            echo "image_tags=${image_tags[@]}" >> $GITHUB_OUTPUT
            echo "image_tags=${image_tags[@]}"

          else
            version=$(git describe --long --tags --exclude latest)
            version=${version#v} # remove the leading v prefix for version
            # The images tags are taken from git
            image_tags=( latest-${GITHUB_SHA} latest ${version} )
            echo "image_tags=${image_tags[@]}" >> $GITHUB_OUTPUT
            echo "image_tags=${image_tags[@]}"
          fi

  publish-flightctl-ui:
    permissions:
      contents: read
    needs: [generate-tags]
    strategy:
      matrix:
        os: [el9, el10]
        arch: ['amd64', 'arm64']
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate OS-specific image name
        id: os-image
        run: |
          echo "image_name=${{ env.QUAY_STANDALONE_REPO }}-${{ matrix.os }}" >> $GITHUB_OUTPUT
          echo "Generated image name: ${{ env.QUAY_STANDALONE_REPO }}-${{ matrix.os }}"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: ${{ steps.os-image.outputs.image_name }}
          tags: _build
          labels: |
            org.flightctl.flightctl-ui.github.repository=${{ github.repository }}
            org.flightctl.flightctl-ui.github.actor=${{ github.actor }}
            org.flightctl.flightctl-ui.github.run_id=${{ github.run_id }}
            org.flightctl.flightctl-ui.github.sha=${{ github.sha }}
            org.flightctl.flightctl-ui.github.ref_name=${{ github.ref_name }}
          extra-args: |
            --ulimit nofile=10000:10000
          containerfiles: packaging/images/${{ matrix.os }}/Containerfile
          context: .

      - name: Validate FIPS
        id: fips
        env:
          BUILD_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          go install github.com/flightctl/fips-validator@latest
          podman unshare -- $HOME/go/bin/fips-validator image "${BUILD_IMAGE}:_build"

      - name: Save image as OCI archive
        env:
          BUILD_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          mkdir -p /tmp/image-archives
          buildah push "${BUILD_IMAGE}:_build" \
            "oci-archive:/tmp/image-archives/${{ matrix.os }}-standalone-${{ matrix.arch }}.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.os }}-standalone-${{ matrix.arch }}
          path: /tmp/image-archives/${{ matrix.os }}-standalone-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  publish-flightctl-ocp-ui:
    permissions:
      contents: read
    needs: [generate-tags]
    strategy:
      matrix:
        os: [el9, el10]
        arch: ['amd64', 'arm64']
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate OS-specific image name
        id: os-image
        run: |
          echo "image_name=${{ env.QUAY_OCP_REPO }}-${{ matrix.os }}" >> $GITHUB_OUTPUT
          echo "Generated image name: ${{ env.QUAY_OCP_REPO }}-${{ matrix.os }}"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: ${{ steps.os-image.outputs.image_name }}
          tags: _build
          labels: |
            org.flightctl.flightctl-ui.github.repository=${{ github.repository }}
            org.flightctl.flightctl-ui.github.actor=${{ github.actor }}
            org.flightctl.flightctl-ui.github.run_id=${{ github.run_id }}
            org.flightctl.flightctl-ui.github.sha=${{ github.sha }}
            org.flightctl.flightctl-ui.github.ref_name=${{ github.ref_name }}
          extra-args: |
            --ulimit nofile=10000:10000
          containerfiles: packaging/images/${{ matrix.os }}/Containerfile.ocp
          context: .

      - name: Validate FIPS
        id: fips
        env:
          BUILD_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          go install github.com/flightctl/fips-validator@latest
          podman unshare -- $HOME/go/bin/fips-validator image "${BUILD_IMAGE}:_build"

      - name: Save image as OCI archive
        env:
          BUILD_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          mkdir -p /tmp/image-archives
          buildah push "${BUILD_IMAGE}:_build" \
            "oci-archive:/tmp/image-archives/${{ matrix.os }}-ocp-${{ matrix.arch }}.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.os }}-ocp-${{ matrix.arch }}
          path: /tmp/image-archives/${{ matrix.os }}-ocp-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  create-manifest-lists:
    permissions: {}
    needs: [publish-flightctl-ui, publish-flightctl-ocp-ui, generate-tags]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all image archives
        uses: actions/download-artifact@v4
        with:
          path: /tmp/image-archives
          pattern: image-*
          merge-multiple: true

      - name: Login to Quay.io
        env:
          QUAY_USER: ${{ secrets.QUAY_FLIGHTCTL_INFRA_ROBOT_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_FLIGHTCTL_INFRA_ROBOT_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | buildah login -u "$QUAY_USER" --password-stdin quay.io

      - name: Create and push manifest lists
        env:
          IMAGE_TAGS: ${{ needs.generate-tags.outputs.image_tags }}
        run: |
          ARCHES="amd64 arm64"

          for os in el9 el10; do
            for variant in standalone ocp; do
              if [ "${variant}" = "standalone" ]; then
                FULL_IMAGE="${QUAY_ORG}/${{ env.QUAY_STANDALONE_REPO }}-${os}"
              else
                FULL_IMAGE="${QUAY_ORG}/${{ env.QUAY_OCP_REPO }}-${os}"
              fi

              for arch in ${ARCHES}; do
                echo "Loading ${os}-${variant}-${arch}"
                buildah pull "oci-archive:/tmp/image-archives/${os}-${variant}-${arch}.tar"
              done

              for tag in ${IMAGE_TAGS}; do
                echo "Creating manifest list for ${FULL_IMAGE}:${tag}"
                buildah manifest create "${FULL_IMAGE}:${tag}"
                for arch in ${ARCHES}; do
                  buildah manifest add "${FULL_IMAGE}:${tag}" \
                    "oci-archive:/tmp/image-archives/${os}-${variant}-${arch}.tar"
                done
                buildah manifest push --all "${FULL_IMAGE}:${tag}" "docker://${FULL_IMAGE}:${tag}"
                buildah manifest rm "${FULL_IMAGE}:${tag}"
              done
            done
          done
